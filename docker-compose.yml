services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kodem
      POSTGRES_USER: kodem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kodem -d kodem']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${REGISTRY_PREFIX-}kodem-api:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://kodem:${POSTGRES_PASSWORD}@postgres:5432/kodem
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_URL: ${APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-google-client-secret}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-github-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-github-client-secret}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:3000/api/auth/github/callback}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-facebook-client-id}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-facebook-client-secret}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-http://localhost:3000/api/auth/facebook/callback}
      GOOGLE_SHEETS_CLIENT_ID: ${GOOGLE_SHEETS_CLIENT_ID:-}
      GOOGLE_SHEETS_CLIENT_SECRET: ${GOOGLE_SHEETS_CLIENT_SECRET:-}
      GOOGLE_SHEETS_CALLBACK_URL: ${GOOGLE_SHEETS_CALLBACK_URL:-http://localhost:3000/api/connections/oauth/google/google_sheets/callback}
      GOOGLE_ANALYTICS_CLIENT_ID: ${GOOGLE_ANALYTICS_CLIENT_ID:-}
      GOOGLE_ANALYTICS_CLIENT_SECRET: ${GOOGLE_ANALYTICS_CLIENT_SECRET:-}
      GOOGLE_ANALYTICS_CALLBACK_URL: ${GOOGLE_ANALYTICS_CALLBACK_URL:-http://localhost:3000/api/connections/oauth/google/google_analytics/callback}
      GOOGLE_BUSINESS_CLIENT_ID: ${GOOGLE_BUSINESS_CLIENT_ID:-}
      GOOGLE_BUSINESS_CLIENT_SECRET: ${GOOGLE_BUSINESS_CLIENT_SECRET:-}
      GOOGLE_BUSINESS_CALLBACK_URL: ${GOOGLE_BUSINESS_CALLBACK_URL:-http://localhost:3000/api/connections/oauth/google/google_business/callback}
      GOOGLE_WORKSPACE_CLIENT_ID: ${GOOGLE_WORKSPACE_CLIENT_ID:-}
      GOOGLE_WORKSPACE_CLIENT_SECRET: ${GOOGLE_WORKSPACE_CLIENT_SECRET:-}
      GOOGLE_WORKSPACE_CALLBACK_URL: ${GOOGLE_WORKSPACE_CALLBACK_URL:-http://localhost:3000/api/connections/oauth/google/google_workspace/callback}
      META_FACEBOOK_CLIENT_ID: ${META_FACEBOOK_CLIENT_ID:-}
      META_FACEBOOK_CLIENT_SECRET: ${META_FACEBOOK_CLIENT_SECRET:-}
      META_FACEBOOK_CALLBACK_URL: ${META_FACEBOOK_CALLBACK_URL:-http://localhost:3000/api/connections/oauth/meta/facebook/callback}
      META_INSTAGRAM_CLIENT_ID: ${META_INSTAGRAM_CLIENT_ID:-}
      META_INSTAGRAM_CLIENT_SECRET: ${META_INSTAGRAM_CLIENT_SECRET:-}
      META_INSTAGRAM_CALLBACK_URL: ${META_INSTAGRAM_CALLBACK_URL:-http://localhost:3000/api/connections/oauth/meta/instagram/callback}
      META_WHATSAPP_CLIENT_ID: ${META_WHATSAPP_CLIENT_ID:-}
      META_WHATSAPP_CLIENT_SECRET: ${META_WHATSAPP_CLIENT_SECRET:-}
      META_WHATSAPP_CALLBACK_URL: ${META_WHATSAPP_CALLBACK_URL:-http://localhost:3000/api/connections/oauth/meta/whatsapp/callback}
      META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID: ${META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      CONNECTION_CREDENTIALS_KEY: ${CONNECTION_CREDENTIALS_KEY:-connection-credentials-key-change-me}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ${REGISTRY_PREFIX-}kodem-worker:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WORKER_PORT: 3334
      DATABASE_URL: postgresql://kodem:${POSTGRES_PASSWORD}@postgres:5432/kodem
      WORKER_POLL_MS: ${WORKER_POLL_MS:-2000}

  app:
    image: ${REGISTRY_PREFIX-}kodem-app:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        API_ORIGIN: http://api:3333
        NEXT_PUBLIC_MARKETING_URL: ${PUBLIC_SITE_URL:-http://localhost:4321}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - '127.0.0.1:3000:3000'

  marketing:
    image: ${REGISTRY_PREFIX-}kodem-marketing:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.marketing
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:4321}
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3333/api}
        PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
        PUBLIC_APP_SIGNUP_URL: ${PUBLIC_APP_SIGNUP_URL:-http://localhost:3000/register}
        PUBLIC_WHATSAPP_PHONE: ${PUBLIC_WHATSAPP_PHONE:-}
    restart: unless-stopped
    ports:
      - '127.0.0.1:4321:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
