services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kodem
      POSTGRES_USER: kodem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kodem -d kodem']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${REGISTRY_PREFIX-}kodem-api:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://kodem:${POSTGRES_PASSWORD}@postgres:5432/kodem
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_URL: ${APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-google-client-secret}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-github-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-github-client-secret}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:3000/api/auth/github/callback}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-facebook-client-id}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-facebook-client-secret}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-http://localhost:3000/api/auth/facebook/callback}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ${REGISTRY_PREFIX-}kodem-worker:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WORKER_PORT: 3334
      DATABASE_URL: postgresql://kodem:${POSTGRES_PASSWORD}@postgres:5432/kodem
      WORKER_POLL_MS: ${WORKER_POLL_MS:-2000}

  app:
    image: ${REGISTRY_PREFIX-}kodem-app:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        API_ORIGIN: http://api:3333
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  postgres_data:
