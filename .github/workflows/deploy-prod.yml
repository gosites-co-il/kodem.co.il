name: Deploy Production

on:
  push:
    tags:
      - 'v-*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag to build and deploy the images under, e.g. v-1.0.0.
        required: true
        type: string
      custom_domains:
        description: Bind app.kodem.co.il and api.kodem.co.il. Uncheck for the very first deploy of the environment, before the DNS records can exist.
        type: boolean
        default: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the ref to point at main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "${{ github.ref_name }} is not on main. Refusing production deploy."
            exit 1
          fi
          echo "${{ github.ref_name }} is on main."

  deploy:
    # needs: guard
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: prod
      github_environment: production
      image_tag: ${{ inputs.image_tag || github.ref_name }}
      extra_tags: prod
      # inputs is empty on a tag push, and an unset input compares equal to false, so
      # the event has to be checked before the input can be trusted.
      custom_domains: ${{ github.event_name != 'workflow_dispatch' || inputs.custom_domains }}
