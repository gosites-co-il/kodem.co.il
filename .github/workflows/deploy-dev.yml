name: Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      custom_domains:
        description: Bind app.dev.kodem.co.il and api.dev.kodem.co.il. Uncheck for the very first deploy of the environment, before the DNS records can exist.
        type: boolean
        default: true

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: dev
      github_environment: development
      image_tag: dev
      extra_tags: dev
      # inputs is empty on push, and an unset input compares equal to false, so the
      # event has to be checked before the input can be trusted.
      custom_domains: ${{ github.event_name != 'workflow_dispatch' || inputs.custom_domains }}
