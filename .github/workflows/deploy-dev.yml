name: Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      custom_domains:
        description: Bind app.dev.kodem.co.il and api.dev.kodem.co.il. Uncheck for the very first deploy of the environment, before the DNS records can exist.
        type: boolean
        default: true

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: dev
      image_tag: dev
      extra_tags: dev
      custom_domains: ${{ inputs.custom_domains != false }}
