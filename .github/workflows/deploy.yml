name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Environment to deploy, dev or prod. Suffixes the Azure resource names and selects deploy/azure/main.parameters.<env>.json.
        required: true
        type: string
      github_environment:
        description: GitHub Environment holding the Azure credentials and app secrets. Separate from the name above because GitHub Environments cannot be renamed.
        required: true
        type: string
      image_tag:
        description: Extra alias pushed to ACR (dev, prod, v-1.0.0). The running revision is always the git SHA, because Container Apps will not pull a new image that reuses a tag.
        required: true
        type: string
      extra_tags:
        required: false
        type: string
        default: ''
      platforms:
        description: Docker platforms. Container Apps runs amd64, which is also native on GitHub-hosted runners.
        required: false
        type: string
        default: linux/amd64
      api_origin:
        description: Origin the Next.js app proxies /api to. Baked into the app image at build time; must match the api container app name.
        required: false
        type: string
        default: http://kodem-api
      custom_domains:
        description: Bind the custom domains once their DNS records resolve. Set false to serve on the generated Container Apps FQDNs instead, which unbinds any domain already on the apps.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: CI=true npx nx run-many -t lint --projects=app,api,worker

      - run: CI=true npx nx build marketing

  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            file: docker/Dockerfile.app
          - service: api
            file: docker/Dockerfile.api
          - service: worker
            file: docker/Dockerfile.worker
          - service: marketing
            file: docker/Dockerfile.marketing
    steps:
      - uses: actions/checkout@v4

      - name: Check environment configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_CONTAINER_REGISTRY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing GitHub Environment variables: ${missing[*]}"
            echo "Run deploy/azure/bootstrap-azure.sh and apply the configuration it prints."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
        if: contains(inputs.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_CONTAINER_REGISTRY }}"

      - name: Build image tags
        id: meta
        env:
          REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io
          REPO: kodem-${{ matrix.service }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          EXTRA_TAGS: ${{ inputs.extra_tags }}
        run: |
          set -euo pipefail
          TAGS="$REGISTRY/$REPO:$IMAGE_TAG"
          TAGS="$TAGS,$REGISTRY/$REPO:$GITHUB_SHA"
          if [ -n "$EXTRA_TAGS" ]; then
            TAGS="$TAGS,$REGISTRY/$REPO:$EXTRA_TAGS"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "cache=$REGISTRY/$REPO:buildcache" >> "$GITHUB_OUTPUT"

      - name: Resolve marketing public URLs
        id: urls
        env:
          AZURE_ENV: ${{ inputs.environment }}
          APP_CUSTOM_DOMAIN: ${{ vars.APP_CUSTOM_DOMAIN }}
          API_CUSTOM_DOMAIN: ${{ vars.API_CUSTOM_DOMAIN }}
          MARKETING_CUSTOM_DOMAIN: ${{ vars.MARKETING_CUSTOM_DOMAIN }}
          PUBLIC_WHATSAPP_PHONE: ${{ vars.PUBLIC_WHATSAPP_PHONE }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
        run: |
          set -euo pipefail
          PARAMS="deploy/azure/main.parameters.$AZURE_ENV.json"
          APP_DOMAIN="${APP_CUSTOM_DOMAIN:-$(jq -r '.parameters.appCustomDomain.value // ""' "$PARAMS")}"
          API_DOMAIN="${API_CUSTOM_DOMAIN:-$(jq -r '.parameters.apiCustomDomain.value // ""' "$PARAMS")}"
          MARKETING_DOMAIN="${MARKETING_CUSTOM_DOMAIN:-$(jq -r '.parameters.marketingCustomDomain.value // ""' "$PARAMS")}"

          if [ -n "$MARKETING_DOMAIN" ]; then
            echo "site_url=https://$MARKETING_DOMAIN" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://kodem.co.il" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$API_DOMAIN" ]; then
            echo "api_url=https://$API_DOMAIN/api" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=https://api.kodem.co.il/api" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$APP_DOMAIN" ]; then
            echo "signup_url=https://$APP_DOMAIN/register" >> "$GITHUB_OUTPUT"
          else
            echo "signup_url=https://app.kodem.co.il/register" >> "$GITHUB_OUTPUT"
          fi
          echo "whatsapp_phone=${PUBLIC_WHATSAPP_PHONE:-}" >> "$GITHUB_OUTPUT"
          echo "ga_id=${PUBLIC_GA_MEASUREMENT_ID:-}" >> "$GITHUB_OUTPUT"
          echo "meta_pixel_id=${PUBLIC_META_PIXEL_ID:-}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ inputs.platforms }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            API_ORIGIN=${{ inputs.api_origin }}
            PUBLIC_SITE_URL=${{ steps.urls.outputs.site_url }}
            PUBLIC_API_URL=${{ steps.urls.outputs.api_url }}
            PUBLIC_APP_SIGNUP_URL=${{ steps.urls.outputs.signup_url }}
            PUBLIC_WHATSAPP_PHONE=${{ steps.urls.outputs.whatsapp_phone }}
            PUBLIC_GA_MEASUREMENT_ID=${{ steps.urls.outputs.ga_id }}
            PUBLIC_META_PIXEL_ID=${{ steps.urls.outputs.meta_pixel_id }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.cache }},mode=max,image-manifest=true,oci-mediatypes=true

  deploy:
    needs: [validate, build-and-push]
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    outputs:
      app_url: ${{ steps.infra.outputs.app_url }}
      api_url: ${{ steps.infra.outputs.api_url }}
      marketing_url: ${{ steps.infra.outputs.marketing_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check environment configuration
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_RESOURCE_GROUP POSTGRES_ADMIN_PASSWORD JWT_SECRET; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing GitHub Environment configuration: ${missing[*]}"
            echo "Run deploy/azure/bootstrap-azure.sh and apply the configuration it prints."
            exit 1
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure and container apps
        id: infra
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_ENV: ${{ inputs.environment }}
          GITHUB_ENV_NAME: ${{ inputs.github_environment }}
          CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          CUSTOM_DOMAINS: ${{ inputs.custom_domains }}
          APP_CUSTOM_DOMAIN: ${{ vars.APP_CUSTOM_DOMAIN }}
          API_CUSTOM_DOMAIN: ${{ vars.API_CUSTOM_DOMAIN }}
          MARKETING_CUSTOM_DOMAIN: ${{ vars.MARKETING_CUSTOM_DOMAIN }}
          POSTGRES_LOCATION: ${{ vars.POSTGRES_LOCATION }}
          POSTGRES_VERSION: ${{ vars.POSTGRES_VERSION }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ vars.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          OAUTH_GOOGLE_SHEETS_CLIENT_ID: ${{ vars.OAUTH_GOOGLE_SHEETS_CLIENT_ID }}
          OAUTH_GOOGLE_SHEETS_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_SHEETS_CLIENT_SECRET }}
          CONNECTION_CREDENTIALS_KEY: ${{ secrets.CONNECTION_CREDENTIALS_KEY }}
          OAUTH_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          OAUTH_FACEBOOK_CLIENT_ID: ${{ vars.OAUTH_FACEBOOK_CLIENT_ID }}
          OAUTH_FACEBOOK_CLIENT_SECRET: ${{ secrets.OAUTH_FACEBOOK_CLIENT_SECRET }}
          MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SIGNUP_ADMIN_EMAIL: ${{ vars.SIGNUP_ADMIN_EMAIL }}
        run: |
          set -euo pipefail

          # The domains live in main.parameters.<env>.json; a GitHub Environment
          # variable overrides one when set.
          PARAMS="deploy/azure/main.parameters.$AZURE_ENV.json"
          APP_DOMAIN="${APP_CUSTOM_DOMAIN:-$(jq -r '.parameters.appCustomDomain.value // ""' "$PARAMS")}"
          API_DOMAIN="${API_CUSTOM_DOMAIN:-$(jq -r '.parameters.apiCustomDomain.value // ""' "$PARAMS")}"
          MARKETING_DOMAIN="${MARKETING_CUSTOM_DOMAIN:-$(jq -r '.parameters.marketingCustomDomain.value // ""' "$PARAMS")}"

          txt_record_exists() {
            # dig is on the GitHub-hosted images, but the fallback keeps this working
            # on a self-hosted runner without dnsutils.
            if command -v dig >/dev/null 2>&1; then
              [ -n "$(dig +short TXT "$1" 2>/dev/null)" ]
            else
              [ -n "$(curl -fsS -H 'accept: application/dns-json' \
                "https://cloudflare-dns.com/dns-query?name=$1&type=TXT" | jq -r '.Answer[]?.data')" ]
            fi
          }

          is_bound() {
            az containerapp show --name "$1" --resource-group "$RESOURCE_GROUP" \
              --query "properties.configuration.ingress.customDomains[?name=='$2'] | length(@)" \
              -o tsv 2>/dev/null | grep -qv '^0$'
          }

          # A managed certificate is validated against DNS records that name the
          # container app, so they cannot exist before the app does: a new environment
          # has to come up without its domains and bind them on a later run. Asking for
          # a hostname whose asuid record is missing fails the whole deployment, so
          # each one is checked rather than assumed.
          #
          # A hostname already on the app stays on it whatever the lookup says. A
          # resolver hiccup must not take a live domain off a running environment.
          domain_is_ready() {
            local domain="$1" app="$2"
            if is_bound "$app" "$domain" || txt_record_exists "asuid.$domain"; then
              return 0
            fi
            echo "::notice::Deploying without $domain because asuid.$domain does not resolve yet. Create the DNS records from the job summary, then deploy again to bind it."
            return 1
          }

          if [ "$CUSTOM_DOMAINS" != "true" ]; then
            APP_DOMAIN=""
            API_DOMAIN=""
            MARKETING_DOMAIN=""
          else
            if [ -n "$APP_DOMAIN" ] && ! domain_is_ready "$APP_DOMAIN" kodem-app; then
              APP_DOMAIN=""
            fi
            if [ -n "$API_DOMAIN" ] && ! domain_is_ready "$API_DOMAIN" kodem-api; then
              API_DOMAIN=""
            fi
            if [ -n "$MARKETING_DOMAIN" ] && ! domain_is_ready "$MARKETING_DOMAIN" kodem-marketing; then
              MARKETING_DOMAIN=""
            fi
          fi

          # Only set when a GitHub Environment variable overrides the template, so the
          # region and version stay whatever main.bicep says by default.
          POSTGRES_PARAMS=()
          if [ -n "$POSTGRES_LOCATION" ]; then
            POSTGRES_PARAMS+=("postgresLocation=$POSTGRES_LOCATION")
          fi
          if [ -n "$POSTGRES_VERSION" ]; then
            POSTGRES_PARAMS+=("postgresVersion=$POSTGRES_VERSION")
          fi

          ENV_NAME="kodem-$AZURE_ENV-env"

          named_cert_exists() {
            local domain="$1" name count
            name="${domain//./-}"
            count=$(az containerapp env certificate list -n "$ENV_NAME" -g "$RESOURCE_GROUP" \
              --query "[?name=='$name'] | length(@)" -o tsv 2>/dev/null || echo 0)
            [ "${count:-0}" != "0" ]
          }

          wait_for_cert_operations() {
            local i state
            for i in $(seq 1 30); do
              state=$(az containerapp env certificate list -n "$ENV_NAME" -g "$RESOURCE_GROUP" \
                --query "[?properties.provisioningState=='Pending' || properties.provisioningState=='InProgress'] | length(@)" \
                -o tsv 2>/dev/null || echo 0)
              if [ "${state:-0}" = "0" ]; then
                return 0
              fi
              echo "Waiting for a managed certificate issuance to finish ($i/30)..."
              sleep 20
            done
            echo "::warning::A managed certificate is still issuing after 10 minutes; continuing."
          }

          delete_auto_certs_for() {
            local domain="$1" keep certs name
            [ -n "$domain" ] || return 0
            keep="${domain//./-}"
            certs=$(az containerapp env certificate list -n "$ENV_NAME" -g "$RESOURCE_GROUP" -o json 2>/dev/null || echo '[]')
            while read -r name; do
              [ -n "$name" ] || continue
              echo "Removing leftover Auto certificate $name for $domain (keeping $keep)."
              az containerapp env certificate delete -n "$ENV_NAME" -g "$RESOURCE_GROUP" \
                --certificate "$name" --yes
            done < <(echo "$certs" | jq -r --arg domain "$domain" --arg keep "$keep" '
                .[]
                | select((.properties.subjectName // .subjectName) == $domain)
                | select(.name != $keep)
                | .name')
          }

          unbind_hostname() {
            local app="$1" domain="$2"
            [ -n "$domain" ] || return 0
            is_bound "$app" "$domain" || return 0
            echo "Temporarily removing $domain from $app so leftover Auto certificates can be deleted."
            az containerapp hostname delete -n "$app" -g "$RESOURCE_GROUP" --hostname "$domain" --yes \
              || az containerapp hostname delete -n "$app" -g "$RESOURCE_GROUP" --hostname "$domain"
          }

          interpret_errors() {
            if grep -q "'Version' should be in: \[\]" "$ERRORS"; then
              PG_LOCATION="${POSTGRES_LOCATION:-$(az group show --name "$RESOURCE_GROUP" --query location -o tsv)}"
              PG_SKU=$(jq -r '.parameters.postgresSkuName.value // "Standard_B1ms"' "$PARAMS")
              echo ""
              echo "PostgreSQL flexible servers look unavailable to this subscription in $PG_LOCATION."
              echo "Confirm with an account that can read the subscription:"
              echo ""
              echo "  az postgres flexible-server list-skus --location $PG_LOCATION -o table"
              echo ""
              echo "An empty answer means the region is the problem, not the parameters. Set the"
              echo "POSTGRES_LOCATION variable on the $GITHUB_ENV_NAME environment to a region that"
              echo "does answer, or ask Azure support to enable flexible servers in $PG_LOCATION."
              echo "An answer without $PG_SKU means the compute tier is the problem instead:"
              echo "change postgresSkuName in $PARAMS to one it lists."
              echo ""
              echo "deploy/azure/README.md covers both."
            fi

            if grep -qE 'DuplicateManagedCertificateInEnvironment|ExistingManagedCertificateOperationInProgress' "$ERRORS"; then
              echo ""
              echo "A leftover Auto-issued certificate (named <hostname>-kodem-pr-…) is blocking"
              echo "the named certificate the template manages. The deploy unbinds the hostname,"
              echo "deletes those leftovers, then issues app-kodem-co-il / api-kodem-co-il / marketing host certs."
              echo "If one is still issuing, wait and re-run:"
              echo ""
              echo "  az containerapp env certificate list -n $ENV_NAME -g $RESOURCE_GROUP -o table"
            fi
          }

          deploy_once() {
            local name="$1"
            shift
            ERRORS=$(mktemp)
            if ! OUTPUTS=$(az deployment group create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$name" \
              --template-file deploy/azure/main.bicep \
              --parameters "deploy/azure/main.parameters.$AZURE_ENV.json" \
              --parameters \
                containerRegistryName="$CONTAINER_REGISTRY" \
                imageTag="$GITHUB_SHA" \
                postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
                jwtSecret="$JWT_SECRET" \
                googleClientId="$OAUTH_GOOGLE_CLIENT_ID" \
                googleClientSecret="$OAUTH_GOOGLE_CLIENT_SECRET" \
                googleSheetsClientId="${OAUTH_GOOGLE_SHEETS_CLIENT_ID:-}" \
                googleSheetsClientSecret="${OAUTH_GOOGLE_SHEETS_CLIENT_SECRET:-}" \
                connectionCredentialsKey="${CONNECTION_CREDENTIALS_KEY:-}" \
                githubClientId="$OAUTH_GITHUB_CLIENT_ID" \
                githubClientSecret="$OAUTH_GITHUB_CLIENT_SECRET" \
                facebookClientId="$OAUTH_FACEBOOK_CLIENT_ID" \
                facebookClientSecret="$OAUTH_FACEBOOK_CLIENT_SECRET" \
                mailProvider="${MAIL_PROVIDER:-stub}" \
                mailFrom="${MAIL_FROM:-noreply@kodem.co.il}" \
                smtpHost="${SMTP_HOST:-}" \
                smtpPort="${SMTP_PORT:-587}" \
                smtpSecure="${SMTP_SECURE:-false}" \
                smtpUser="${SMTP_USER:-}" \
                smtpPass="${SMTP_PASS:-}" \
                signupAdminEmail="${SIGNUP_ADMIN_EMAIL:-admin@kodem.co.il}" \
                appCustomDomain="$APP_DOMAIN" \
                apiCustomDomain="$API_DOMAIN" \
                marketingCustomDomain="$MARKETING_DOMAIN" \
                "${POSTGRES_PARAMS[@]}" \
                "$@" \
              --query properties.outputs -o json 2>"$ERRORS"); then
              cat "$ERRORS"
              interpret_errors
              exit 1
            fi
          }

          BIND_APP=false
          BIND_API=false
          BIND_MARKETING=false
          if [ -n "$APP_DOMAIN" ] && named_cert_exists "$APP_DOMAIN"; then BIND_APP=true; fi
          if [ -n "$API_DOMAIN" ] && named_cert_exists "$API_DOMAIN"; then BIND_API=true; fi
          if [ -n "$MARKETING_DOMAIN" ] && named_cert_exists "$MARKETING_DOMAIN"; then BIND_MARKETING=true; fi

          NEED_ISSUE=false
          if [ -n "$APP_DOMAIN" ] && [ "$BIND_APP" != "true" ]; then NEED_ISSUE=true; fi
          if [ -n "$API_DOMAIN" ] && [ "$BIND_API" != "true" ]; then NEED_ISSUE=true; fi
          if [ -n "$MARKETING_DOMAIN" ] && [ "$BIND_MARKETING" != "true" ]; then NEED_ISSUE=true; fi

          if [ "$NEED_ISSUE" = "true" ]; then
            # Auto leftover certs (from an earlier bindingType Auto deploy) must be
            # gone before the named ones can be created. They cannot be deleted while
            # still bound to an app.
            if [ -n "$APP_DOMAIN" ] && [ "$BIND_APP" != "true" ]; then
              unbind_hostname kodem-app "$APP_DOMAIN"
            fi
            if [ -n "$API_DOMAIN" ] && [ "$BIND_API" != "true" ]; then
              unbind_hostname kodem-api "$API_DOMAIN"
            fi
            if [ -n "$MARKETING_DOMAIN" ] && [ "$BIND_MARKETING" != "true" ]; then
              unbind_hostname kodem-marketing "$MARKETING_DOMAIN"
            fi
            wait_for_cert_operations
            delete_auto_certs_for "$APP_DOMAIN"
            delete_auto_certs_for "$API_DOMAIN"
            delete_auto_certs_for "$MARKETING_DOMAIN"

            # Register the hostname with no certificate, then issue named certs.
            # Hostnames that already have their named cert stay bound.
            deploy_once "kodem-$AZURE_ENV-$GITHUB_RUN_ID-issue" \
              bindAppCertificate="$BIND_APP" \
              bindApiCertificate="$BIND_API" \
              bindMarketingCertificate="$BIND_MARKETING"
          fi

          if [ -n "$APP_DOMAIN" ]; then BIND_APP=true; fi
          if [ -n "$API_DOMAIN" ]; then BIND_API=true; fi
          if [ -n "$MARKETING_DOMAIN" ]; then BIND_MARKETING=true; fi

          deploy_once "kodem-$AZURE_ENV-$GITHUB_RUN_ID" \
            bindAppCertificate="$BIND_APP" \
            bindApiCertificate="$BIND_API" \
            bindMarketingCertificate="$BIND_MARKETING"

          {
            echo "app_fqdn=$(echo "$OUTPUTS" | jq -r '.appFqdn.value')"
            echo "api_fqdn=$(echo "$OUTPUTS" | jq -r '.apiFqdn.value')"
            echo "marketing_fqdn=$(echo "$OUTPUTS" | jq -r '.marketingFqdn.value')"
            echo "app_url=$(echo "$OUTPUTS" | jq -r '.appUrlResolved.value')"
            echo "api_url=$(echo "$OUTPUTS" | jq -r '.apiUrlResolved.value')"
            echo "marketing_url=$(echo "$OUTPUTS" | jq -r '.marketingUrlResolved.value')"
            echo "app_domain=$(echo "$OUTPUTS" | jq -r '.appCustomDomainConfigured.value')"
            echo "api_domain=$(echo "$OUTPUTS" | jq -r '.apiCustomDomainConfigured.value')"
            echo "marketing_domain=$(echo "$OUTPUTS" | jq -r '.marketingCustomDomainConfigured.value')"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_FQDN: ${{ steps.infra.outputs.app_fqdn }}
          API_FQDN: ${{ steps.infra.outputs.api_fqdn }}
          MARKETING_FQDN: ${{ steps.infra.outputs.marketing_fqdn }}
          APP_URL: ${{ steps.infra.outputs.app_url }}
          API_URL: ${{ steps.infra.outputs.api_url }}
          MARKETING_URL: ${{ steps.infra.outputs.marketing_url }}
        run: |
          set -euo pipefail

          wait_for() {
            local url="$1" attempts="$2" i
            for i in $(seq 1 "$attempts"); do
              if curl -fsS --max-time 15 "$url" >/dev/null; then
                echo "OK  $url"
                return 0
              fi
              echo "  attempt $i/$attempts failed for $url, retrying in 10s..."
              sleep 10
            done
            echo "FAIL $url"
            return 1
          }

          # The generated FQDNs answer regardless of how DNS or certificates are set
          # up, so a failure here is the rollout itself being unhealthy.
          if ! wait_for "https://$APP_FQDN/api/health" 30 \
            || ! wait_for "https://$API_FQDN/api/health" 6 \
            || ! wait_for "https://$MARKETING_FQDN/health" 12; then
            az containerapp logs show --name kodem-api --resource-group "$RESOURCE_GROUP" --tail 100 || true
            az containerapp logs show --name kodem-app --resource-group "$RESOURCE_GROUP" --tail 100 || true
            az containerapp logs show --name kodem-marketing --resource-group "$RESOURCE_GROUP" --tail 100 || true
            exit 1
          fi

          # A custom domain that does not answer means DNS or the managed certificate
          # is still settling, which does not make the deployed revision bad.
          for url in "$APP_URL/api/health" "$API_URL/api/health" "$MARKETING_URL/health"; do
            case "$url" in
              "https://$APP_FQDN"*|"https://$API_FQDN"*|"https://$MARKETING_FQDN"*) continue ;;
            esac
            wait_for "$url" 6 || echo "::warning::$url did not answer yet. Check the DNS records and the managed certificate."
          done

      # Printed on every run, including the first one where the domains are not bound
      # yet: these are exactly the records the managed certificates validate against.
      - name: Custom domain DNS records
        if: always() && steps.infra.outputs.app_fqdn != ''
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_ENV: ${{ inputs.environment }}
          APP_FQDN: ${{ steps.infra.outputs.app_fqdn }}
          API_FQDN: ${{ steps.infra.outputs.api_fqdn }}
          MARKETING_FQDN: ${{ steps.infra.outputs.marketing_fqdn }}
          APP_CUSTOM_DOMAIN: ${{ vars.APP_CUSTOM_DOMAIN }}
          API_CUSTOM_DOMAIN: ${{ vars.API_CUSTOM_DOMAIN }}
          MARKETING_CUSTOM_DOMAIN: ${{ vars.MARKETING_CUSTOM_DOMAIN }}
          APP_DOMAIN_BOUND: ${{ steps.infra.outputs.app_domain }}
          API_DOMAIN_BOUND: ${{ steps.infra.outputs.api_domain }}
          MARKETING_DOMAIN_BOUND: ${{ steps.infra.outputs.marketing_domain }}
        run: |
          set -euo pipefail
          PARAMS="deploy/azure/main.parameters.$AZURE_ENV.json"
          APP_DOMAIN="${APP_CUSTOM_DOMAIN:-$(jq -r '.parameters.appCustomDomain.value // ""' "$PARAMS")}"
          API_DOMAIN="${API_CUSTOM_DOMAIN:-$(jq -r '.parameters.apiCustomDomain.value // ""' "$PARAMS")}"
          MARKETING_DOMAIN="${MARKETING_CUSTOM_DOMAIN:-$(jq -r '.parameters.marketingCustomDomain.value // ""' "$PARAMS")}"

          record_rows() {
            local domain="$1" fqdn="$2"
            [ -n "$domain" ] || return 0
            # Apex domains cannot be CNAMEs; print ALIAS/ANAME guidance instead.
            if [ "$(echo "$domain" | tr '.' '\n' | wc -l)" -le 2 ]; then
              echo "| ALIAS/ANAME (or A) | \`$domain\` | \`$fqdn\` |"
            else
              echo "| CNAME | \`$domain\` | \`$fqdn\` |"
            fi
            echo "| TXT | \`asuid.$domain\` | \`$VERIFICATION_ID\` |"
          }

          VERIFICATION_ID=$(az containerapp show --name kodem-app --resource-group "$RESOURCE_GROUP" \
            --query properties.customDomainVerificationId -o tsv)
          {
            echo "### DNS records for the custom domains"
            echo ""
            echo "| Type | Name | Value |"
            echo "|------|------|-------|"
            record_rows "$APP_DOMAIN" "$APP_FQDN"
            record_rows "$API_DOMAIN" "$API_FQDN"
            record_rows "$MARKETING_DOMAIN" "$MARKETING_FQDN"
            echo ""
            echo "Names are full hostnames; most DNS providers want them relative to the zone."
            echo "The apex marketing domain needs an ALIAS/ANAME (or A) record, not a CNAME."
            if { [ -n "$APP_DOMAIN" ] && [ -z "$APP_DOMAIN_BOUND" ]; } ||
              { [ -n "$API_DOMAIN" ] && [ -z "$API_DOMAIN_BOUND" ]; } ||
              { [ -n "$MARKETING_DOMAIN" ] && [ -z "$MARKETING_DOMAIN_BOUND" ]; }; then
              echo ""
              echo "Some of these are not bound yet, because a hostname is only bound once its"
              echo "\`asuid\` record resolves. Create the records above and deploy again."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        run: |
          {
            echo "### Deployed to Azure Container Apps"
            echo ""
            echo "- Environment: \`${{ inputs.environment }}\` (GitHub Environment \`${{ inputs.github_environment }}\`)"
            echo "- Image: \`${{ github.sha }}\` (also tagged \`${{ inputs.image_tag }}\`)"
            echo "- App: ${{ steps.infra.outputs.app_url }}"
            echo "- API: ${{ steps.infra.outputs.api_url }}"
            echo "- Marketing: ${{ steps.infra.outputs.marketing_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
