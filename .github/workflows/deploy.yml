name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment holding the Azure credentials and app secrets.
        required: true
        type: string
      azure_environment:
        description: Short environment name used for Azure resource naming (dev or prod).
        required: true
        type: string
      image_tag:
        required: true
        type: string
      extra_tags:
        required: false
        type: string
        default: ''
      platforms:
        description: Docker platforms. Container Apps runs amd64, which is also native on GitHub-hosted runners.
        required: false
        type: string
        default: linux/amd64
      api_origin:
        description: Origin the Next.js app proxies /api to. Baked into the app image at build time; must match the api container app name.
        required: false
        type: string
        default: http://kodem-api

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: CI=true npx nx run-many -t lint --projects=app,api,worker

  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            file: docker/Dockerfile.app
          - service: api
            file: docker/Dockerfile.api
          - service: worker
            file: docker/Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - name: Check environment configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_CONTAINER_REGISTRY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing GitHub Environment variables: ${missing[*]}"
            echo "Run deploy/azure/bootstrap-azure.sh and apply the configuration it prints."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
        if: contains(inputs.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_CONTAINER_REGISTRY }}"

      - name: Build image tags
        id: meta
        env:
          REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io
          REPO: kodem-${{ matrix.service }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          EXTRA_TAGS: ${{ inputs.extra_tags }}
        run: |
          set -euo pipefail
          TAGS="$REGISTRY/$REPO:$IMAGE_TAG"
          TAGS="$TAGS,$REGISTRY/$REPO:$GITHUB_SHA"
          if [ -n "$EXTRA_TAGS" ]; then
            TAGS="$TAGS,$REGISTRY/$REPO:$EXTRA_TAGS"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "cache=$REGISTRY/$REPO:buildcache" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ inputs.platforms }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            API_ORIGIN=${{ inputs.api_origin }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.cache }},mode=max,image-manifest=true,oci-mediatypes=true

  deploy:
    needs: [validate, build-and-push]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      app_url: ${{ steps.infra.outputs.app_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check environment configuration
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_RESOURCE_GROUP POSTGRES_ADMIN_PASSWORD JWT_SECRET; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing GitHub Environment configuration: ${missing[*]}"
            echo "Run deploy/azure/bootstrap-azure.sh and apply the configuration it prints."
            exit 1
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure and container apps
        id: infra
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_ENV: ${{ inputs.azure_environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          APP_CUSTOM_DOMAIN: ${{ vars.APP_CUSTOM_DOMAIN }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ vars.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          OAUTH_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          OAUTH_FACEBOOK_CLIENT_ID: ${{ vars.OAUTH_FACEBOOK_CLIENT_ID }}
          OAUTH_FACEBOOK_CLIENT_SECRET: ${{ secrets.OAUTH_FACEBOOK_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          OUTPUTS=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "kodem-$AZURE_ENV-$GITHUB_RUN_ID" \
            --template-file deploy/azure/main.bicep \
            --parameters "deploy/azure/main.parameters.$AZURE_ENV.json" \
            --parameters \
              containerRegistryName="$CONTAINER_REGISTRY" \
              imageTag="$IMAGE_TAG" \
              appCustomDomain="$APP_CUSTOM_DOMAIN" \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              jwtSecret="$JWT_SECRET" \
              googleClientId="$OAUTH_GOOGLE_CLIENT_ID" \
              googleClientSecret="$OAUTH_GOOGLE_CLIENT_SECRET" \
              githubClientId="$OAUTH_GITHUB_CLIENT_ID" \
              githubClientSecret="$OAUTH_GITHUB_CLIENT_SECRET" \
              facebookClientId="$OAUTH_FACEBOOK_CLIENT_ID" \
              facebookClientSecret="$OAUTH_FACEBOOK_CLIENT_SECRET" \
            --query properties.outputs -o json)

          APP_FQDN=$(echo "$OUTPUTS" | jq -r '.appFqdn.value')
          RESOLVED_APP_URL=$(echo "$OUTPUTS" | jq -r '.appUrlResolved.value')
          echo "app_fqdn=$APP_FQDN" >> "$GITHUB_OUTPUT"
          echo "app_url=$RESOLVED_APP_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to https://$APP_FQDN (public URL $RESOLVED_APP_URL)"

      - name: Smoke test API health
        env:
          APP_FQDN: ${{ steps.infra.outputs.app_fqdn }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "https://$APP_FQDN/api/health" >/dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed"
          az containerapp logs show --name kodem-api --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --tail 100 || true
          az containerapp logs show --name kodem-app --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --tail 100 || true
          exit 1

      - name: Summary
        run: |
          {
            echo "### Deployed to Azure Container Apps"
            echo ""
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Image tag: \`${{ inputs.image_tag }}\`"
            echo "- URL: ${{ steps.infra.outputs.app_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
