server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Container Apps / compose health probes
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Astro hashed assets
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    # Prefer exact file, then directory index (Astro emits /about/index.html)
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
